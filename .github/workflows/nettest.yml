name: Net test (manual)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q requests cloudscraper curl_cffi
          python - <<'EOF'
          import requests
          urls = ["https://fcmobileforum.com/api/v1/shardiq/cards?limit=5", "https://fcmobileforum.com/shardiq",
                  "https://fcmobilesquad.com/star-signings-players?sort=cheapest&page=2"]
          br = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36",
                "Accept": "application/json, text/plain, */*", "Referer": "https://fcmobileforum.com/shardiq"}
          for u in urls:
              try: r = requests.get(u, headers=br, timeout=30); print("requests", r.status_code, len(r.text), u)
              except Exception as e: print("requests ERR", e, u)
              try:
                  from curl_cffi import requests as cr
                  r = cr.get(u, impersonate="chrome", headers={"Referer": "https://fcmobileforum.com/shardiq"}, timeout=30)
                  print("curl_cffi", r.status_code, len(r.text), r.text[:80].replace("\n", " "), u)
              except Exception as e: print("curl_cffi ERR", e, u)
          EOF
