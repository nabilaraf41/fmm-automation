name: FMM best-of long video

on:
  workflow_dispatch: {}

concurrency:
  group: fmm-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
      - name: Build and post
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -u -m fmm.bestof
      - name: Save state
        if: always()
        run: |
          git config user.name "fmm-bot"
          git config user.email "fmm-bot@users.noreply.github.com"
          git add content/posted.json
          git diff --cached --quiet || (git commit -m "Best-of posted [skip ci]" && git pull --rebase -q && git push)
