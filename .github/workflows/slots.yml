name: FMM daily slots

# Manual runs only; the 2-hourly job in codes.yml posts the slots (07:00 / 13:00 / 19:00 / 21:00 BDT).
on:
  workflow_dispatch:
    inputs:
      mode: {description: "build or post", required: true, default: build, type: choice, options: [build, post, reel, ig]}   # reel = only the Reel of the latest build; ig = re-post the built video to Instagram only
      slot: {description: "0700 / 1300 / 1900 / 2100", required: false, default: "1300"}

run-name: "${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.mode, inputs.slot) || 'scheduled' }}"

concurrency:
  group: fmm-state
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Dhaka
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}   # latest state at start, not at trigger time (queued runs reposted slots)

      - name: Which job?
        id: which
        run: |
          case "${{ github.event.schedule }}" in
            "30 0 * * *")  echo "mode=build" >> $GITHUB_OUTPUT; echo "slot=0700" >> $GITHUB_OUTPUT ;;
            "30 6 * * *")  echo "mode=build" >> $GITHUB_OUTPUT; echo "slot=1300" >> $GITHUB_OUTPUT ;;
            "30 14 * * *") echo "mode=build" >> $GITHUB_OUTPUT; echo "slot=2100" >> $GITHUB_OUTPUT ;;
            "0 18 * * *")  echo "mode=build" >> $GITHUB_OUTPUT; echo "slot=0030" >> $GITHUB_OUTPUT ;;
            "")            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT; echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT ;;
            *)             echo "mode=post" >> $GITHUB_OUTPUT ;;
          esac

      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg   # post needs it too: every photo goes with its Reel
          pip install -r requirements.txt

      # ---------- build (30 min before) ----------
      - name: Build slot content
        if: steps.which.outputs.mode == 'build'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}   # for the YouTube trend check
        run: python -u -m fmm.slots build ${{ steps.which.outputs.slot }}

      - name: Keep media for the post job
        if: steps.which.outputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with: {name: slot-media, path: output/slot/, retention-days: 1}

      # ---------- post (at slot time) ----------
      - name: Fetch media from latest build
        if: steps.which.outputs.mode == 'post' || steps.which.outputs.mode == 'reel' || steps.which.outputs.mode == 'ig'
        run: |
          # newest successful run that has slot media, made in the last 60 min (never repost an old build)
          since=$(date -u -d '-60 min' +%Y-%m-%dT%H:%M:%SZ)
          for id in $(gh run list -R ${{ github.repository }} -w slots.yml -s success -L 15 --json databaseId,createdAt                       -q ".[] | select(.createdAt >= \"$since\") | .databaseId"); do
            gh run download "$id" -R ${{ github.repository }} -n slot-media -D output/slot 2>/dev/null && { echo "build run: $id"; break; }
          done
          test -f output/slot/manifest.json || { echo "no fresh build in the last 60 min - nothing posted"; exit 1; }

      - name: Re-post the built video to Instagram only
        if: steps.which.outputs.mode == 'ig'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python -u -c "from fmm import poster; from pathlib import Path; print(poster.post('reel', 'output/slot/slot.mp4', Path('output/slot/caption.txt').read_text(encoding='utf-8'), where='ig'))"

      - name: Publish the Reel only (photo already posted)
        if: steps.which.outputs.mode == 'reel'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -u -c "from fmm import poster, reel; from pathlib import Path; p=Path('output/slot/slot.png'); print(poster.post('reel', reel.make_reel(p, seconds=10), Path('output/slot/caption.txt').read_text(encoding='utf-8')))"

      - name: Publish
        if: steps.which.outputs.mode == 'post'
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -u -m fmm.slots post

      - name: Save state
        if: always()
        run: |
          git config user.name "fmm-bot"
          git config user.email "fmm-bot@users.noreply.github.com"
          python -m fmm.savestate "Update state [skip ci]"   # merges with anything saved meanwhile
