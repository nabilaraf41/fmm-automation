name: FMM hourly

on:
  schedule:
    - cron: "5 * * * *" # every hour at :05 = backup that restarts the self-chain if it ever breaks
    - cron: "50 23,5,9,11,13 * * *" # 05:50/11:50/15:50/17:50/19:50 BDT: build early, post exactly at 07/13/17/19/21:00
  workflow_dispatch: {}       # "Run workflow" button for manual runs

concurrency:
  group: fmm-state
  cancel-in-progress: false

permissions:
  contents: write             # to save codes_state.json / posted.json back
  actions: write              # to start the next run (self-chain below)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Note start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with: {ref: main}   # latest state at start, not at trigger time (queued runs reposted slots)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Check codes and post
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TZ: Asia/Dhaka
        run: python -u -m fmm.run_cloud

      - name: Save state
        if: always()
        run: |
          git config user.name "fmm-bot"
          git config user.email "fmm-bot@users.noreply.github.com"
          python -m fmm.savestate "Update state [skip ci]"   # merges with anything saved meanwhile

      # owner (12 Nov): nothing may be skipped. GitHub cron skips runs and the Apps Script trigger can stall, so every
      # run starts the next one ~55 min after it began (workflow_dispatch from GITHUB_TOKEN is allowed; repo is public,
      # so minutes are free). Cron + Apps Script stay as backups that restart the chain if it ever breaks.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(( STARTED + 3300 - $(date +%s) ))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          gh workflow run codes.yml -R "$GITHUB_REPOSITORY" --ref main
