<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #07060c; --red: #e11d2e; --purple: #7c3aed; --ink: #fff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: Impact, "Arial Black", sans-serif; }
      .glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgba(225,29,46,.55), transparent 55%),
              radial-gradient(circle at 50% 70%, rgba(124,58,237,.45), transparent 60%); }
      .stripe { position: absolute; left: -200px; width: 1480px; height: 140px; background: var(--red); transform: rotate(-12deg); }
      #s1 { top: 560px; } #s2 { top: 1180px; background: var(--purple); }
      #logo { position: absolute; left: 140px; top: 640px; width: 800px; }
      #atb { position: absolute; left: 390px; top: 1060px; width: 300px; height: 300px; }
      #title { position: absolute; width: 100%; top: 1420px; text-align: center; color: var(--ink); font-size: 104px; letter-spacing: 2px;
               text-shadow: 0 6px 0 #000, 0 0 40px var(--red); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div class="glow clip" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="s1" class="stripe clip" data-start="0" data-duration="3" data-track-index="1"></div>
      <div id="s2" class="stripe clip" data-start="0" data-duration="3" data-track-index="2"></div>
      <img id="logo" class="clip" src="logo.png" data-start="0" data-duration="3" data-track-index="3" />
      <img id="atb" class="clip" src="atb.png" data-start="0" data-duration="3" data-track-index="4" />
      <div id="title" class="clip" data-start="0" data-duration="3" data-track-index="5">LET'S GO!</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s1", { x: -1500 }, { x: 0, duration: 0.35, ease: "power4.out" }, 0)
        .fromTo("#s2", { x: 1500 }, { x: 0, duration: 0.35, ease: "power4.out" }, 0.08)
        .fromTo("#logo", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 0.25)
        .fromTo("#atb", { y: 300, opacity: 0, rotation: -20 }, { y: 0, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.6)
        .fromTo("#title", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, 1.0)
        .to("#logo", { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1 }, 1.3)
        .to("#root", { opacity: 0, duration: 0.25 }, 2.75);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
